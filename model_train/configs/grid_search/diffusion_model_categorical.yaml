out_dir: results/trained_model_categorical
dataset:
  features: [None]
  file_path: ["dataset/train_dataset_new"]
  graph_filter: ['*']
  targets: ["2-core decycling"]
  task: ["node"]
  task_type: ["classification"]
  SL: [True]
loss:
  loss_metric: ["CrossEntropyLoss"]
net:
  task_model: ["FVSModel"]
  diffusion_type: ["categorical"]
  diffusion_schedule: ["linear"]
  diffusion_steps: [1000]
  inference_diffusion_steps: [20]
  inference_schedule: ["cosine"]
  timewarping_set: [False]
  loss_weight_schedule: ["logNormal","constant"] #"constant","logNormal"
  parallel_sampling: [2]
  sequential_sampling: [2]
  norm: [True]
  GNNEncoder_set: ["T2TGNNEncoder"]
  GNNEncoder_param:
    T2TGNNEncoder:
      learn_norm: [True]
      n_layers: [12]
      hidden_dim: [64]
      gconv: ["AGNNConv","GATv2Conv"]
      gconv_param:
        AGNNConv:
          aggregation: [ "sum" ]
          norm: [ "layer" ]
          learn_norm: [ True ]
          track_norm: [ False ]
          gated: [ True ]
          mode: [ "direct" ]
          sparse: [ True ]
        ResGatedGraphConv:
          bias: [ true ]
          edge_dim: [128]
          root_weight: [ true ]
        GATConv:
          concat: [ true ]
          dropout: [ 0.5 ]
          heads: [ 2 ]
          edge_dim: [64]
          negative_slope: [ 0.2 ]
        GATv2Conv:
          concat: [ true ]
          dropout: [ 0.1,0.5 ]
          heads: [ 2,4,8 ]
          negative_slope: [ 0.2 ]
          edge_dim: [ 64 ]
    NDGNNEncoder:
      declayers_act: [ReLU]
      declayers_dim: [20]
      declayers_num: [2]
      device: [cuda]
      enclayers_act: [ReLU]
      enclayers_dim: [64]
      enclayers_gnn: ["GATv2Conv"]
      enclayers_gnn_param:
        AGNNConv:
          aggregation: [ "sum" ]
          norm: [ "batch" ]
          learn_norm: [ True ]
          track_norm: [ False ]
          gated: [ True ]
          mode: [ "direct" ]
          sparse: [ True ]
        ResGatedGraphConv:
          bias: [ true ]
          root_weight: [ true ]
          edge_dim: [40]
        GATConv:
          concat: [ true ]
          dropout: [ 0.5 ]
          heads: [ 2 ]
          negative_slope: [ 0.2 ]
          edge_dim: [40]
        GATv2Conv:
          concat: [ true ]
          dropout: [0.1, 0.5 ]
          heads: [ 2,4,8 ]
          negative_slope: [ 0.2 ]
          edge_dim: [ 40 ]
      enclayers_norm: [PairNorm]
      enclayers_num: [2]
      enclayers_time_emb: [True]
      encoder_graph_state: [True]
      gnn_name: [ND_GNN_vanilla]
      gstate_pool_name: [add]
      num_features: [1]
      prelayers_act: [ReLU]
      prelayers_dim: [64]
      prelayers_gnn: ["AGNNConv","ResGatedGraphConv","SAGEConv"]
      prelayers_gnn_param:
        AGNNConv:
          aggregation: [ "sum" ]
          norm: [ "batch" ]
          learn_norm: [ True ]
          track_norm: [ False ]
          gated: [ True ]
          mode: ["direct","residual"]
          sparse: [True]
        ResGatedGraphConv:
          bias: [true]
          root_weight: [true]
        GATConv:
          concat: [true]
          dropout: [0.5]
          heads: [2]
          negative_slope: [0.2]
        SAGEConv:
          aggr: ["mean","sum"]
      prelayers_norm: [GraphSizeNorm]
      prelayers_num: [8]
      prelayers_time_emb: [True]
  rewrite: [ False ]
  rewrite_steps: [ 3 ]
  rewrite_ratio: [ 0.5 ]
  inference_steps: [ 10 ]
  MVC_P: [ 100 ]
  gradient_estimator_type: [ "cost_estimator" ] #"cost_estimator"
  target_weight: [ 1.0 ]
  infer_direction: [ "MVC" ]#,]#
optimizer:
  optimizer_name: [Adam]
  lr: [0.001]
  weight_decay: [ 1e-5]
  scheduler_set: [false]
  scheduler: [MultiStepLR]
  MstepLR_milestones: [[50]]
  MstepLR_gamma: [0.1]
train:
  model_evaluation: ["hold_out"]
  traindata_size: [0.95]
  device: ["cuda"]
  train_batch_size: [128]
  val_batch_size: [128]
  train_epochs: [4]
  test_set: [True]
  ckpt: [ True ]
  ckpt_period: [ 100 ]
